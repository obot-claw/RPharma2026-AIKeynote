name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish, for example main or a draft branch
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html style.css script.js outline.md README.md _site/
          if [ -f AGENTS.md ]; then cp AGENTS.md _site/; fi
          if [ -d notes ]; then cp -R notes _site/notes; fi
          if [ -d docs ]; then cp -R docs _site/docs; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d skills ]; then cp -R skills _site/skills; fi
          touch _site/.nojekyll

      - name: Upload static deck
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
